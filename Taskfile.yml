version: '3'

vars:
  APP_NAME: "res-downloader"
  BIN_DIR: "build/bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target platform. Defaults to the host and is overridden by
  # `wails3 task build GOOS=...` for cross-compilation.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    desc: Builds the application for the target platform
    summary: Builds the application for the target platform
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    desc: Packages a production build of the application
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    desc: Runs the built application
    summary: Runs the built application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    desc: Runs the application in development mode
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  bindings:
    desc: Regenerates the TypeScript bindings for the frontend
    summary: Regenerates the TypeScript bindings for the frontend (add --force to ignore the cache)
    cmds:
      - task: common:generate:bindings

  test:
    desc: Runs the Go test suite
    summary: Runs the Go test suite
    cmds:
      - go test ./...

  check:
    desc: Runs static checks for the backend and the frontend
    summary: Runs static checks for the backend and the frontend
    cmds:
      - go vet ./...
      - task: common:frontend:check
