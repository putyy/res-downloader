name: Test

on:
  pull_request:
    branches: [release/v4.0]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            go-tags: ''
          - os: ubuntu-24.04
            go-tags: webkit2_41
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Vet Go packages
        run: go vet -mod=readonly -tags '${{ matrix.go-tags }}' ./...
      - name: Test Go packages
        run: go test -mod=readonly -tags '${{ matrix.go-tags }}' ./... -count=1 -timeout=300s
      - name: Test downloader with race detector
        run: go test -mod=readonly -race ./internal/download -count=1 -timeout=180s
