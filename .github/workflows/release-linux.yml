name: Build Linux release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      package_version:
        required: true
        type: string
      release_version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: bundled-plugins
          path: plugins

      - name: Build Linux environment
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker build \
            --platform "linux/$ARCH" \
            --network host \
            --file build/linux/dockerfile \
            --tag "res-downloader-linux-$ARCH" \
            .

      - name: Build Linux packages
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          docker run --rm \
            --platform "linux/$ARCH" \
            --network host \
            --privileged \
            --env ARCH \
            --env "HOST_GID=$(id -g)" \
            --env "HOST_UID=$(id -u)" \
            --env PACKAGE_VERSION \
            --env RELEASE_VERSION \
            --volume "$GITHUB_WORKSPACE:/www/res-downloader" \
            "res-downloader-linux-$ARCH" \
            bash -c '
              set -euo pipefail
              cd /www/res-downloader

              restore_workspace_ownership() {
                chown -R "$HOST_UID:$HOST_GID" \
                  bin \
                  build/linux/Debian
                if [[ -d build/linux/appimage ]]; then
                  chown -R "$HOST_UID:$HOST_GID" build/linux/appimage
                fi
              }
              trap restore_workspace_ownership EXIT

              wails3 task linux:build "ARCH=$ARCH" "RELEASE_VERSION=$RELEASE_VERSION" PRODUCTION=true BUNDLE_PLUGINS_SKIP=true

              install -Dm755 \
                bin/res-downloader \
                build/linux/Debian/usr/local/bin/res-downloader
              sed \
                -e "s/{{Version}}/$PACKAGE_VERSION/g" \
                -e "s/{{Architecture}}/$ARCH/g" \
                build/linux/Debian/DEBIAN/.control \
                > build/linux/Debian/DEBIAN/control
              dpkg-deb --build \
                build/linux/Debian \
                "bin/res-downloader_${RELEASE_VERSION}_linux_${ARCH}.deb"

              if [[ "$ARCH" == "amd64" ]]; then
                wails3 task linux:generate:dotdesktop
                wails3 generate appimage \
                  -binary bin/res-downloader \
                  -icon build/appicon.png \
                  -desktopfile build/linux/res-downloader.desktop \
                  -outputdir bin \
                  -builddir build/linux/appimage/build
                mv bin/res-downloader-x86_64.AppImage \
                  "bin/res-downloader_${RELEASE_VERSION}_linux_amd64.AppImage"
              fi

              mv \
                bin/res-downloader \
                "bin/res-downloader_${RELEASE_VERSION}_linux_${ARCH}"
            '

      - name: Upload packages to release
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          assets=(
            "bin/res-downloader_${RELEASE_VERSION}_linux_${ARCH}"
            "bin/res-downloader_${RELEASE_VERSION}_linux_${ARCH}.deb"
          )
          if [[ "$ARCH" == "amd64" ]]; then
            assets+=("bin/res-downloader_${RELEASE_VERSION}_linux_amd64.AppImage")
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      - name: Remove local release files
        if: always()
        shell: bash
        run: rm -f bin/res-downloader_*
