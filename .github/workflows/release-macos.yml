name: Build macOS release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [universal, amd64, arm64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: bundled-plugins
          path: internal/plugin/bundled

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          wails_version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$wails_version"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build DMG
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [[ "$ARCH" == "universal" ]]; then
            wails3 task darwin:package:universal "RELEASE_VERSION=$RELEASE_VERSION" BUNDLE_PLUGINS_SKIP=true
          else
            wails3 task darwin:package "ARCH=$ARCH" "RELEASE_VERSION=$RELEASE_VERSION" BUNDLE_PLUGINS_SKIP=true
          fi
          mv -f \
            "bin/res-downloader.dmg" \
            "bin/res-downloader_${RELEASE_VERSION}_mac_${ARCH}.dmg"

      - name: Upload DMG to release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          ARCH: ${{ matrix.arch }}
        run: >-
          gh release upload "$RELEASE_TAG"
          "bin/res-downloader_${RELEASE_VERSION}_mac_${ARCH}.dmg"
          --clobber

      - name: Remove local release files
        if: always()
        shell: bash
        run: rm -rf bin/res-downloader.app bin/*.dmg
