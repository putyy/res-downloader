version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the macOS executable
    deps:
      - task: common:go:mod:tidy
      - task: common:generate:icons
      - task: common:build:frontend
        vars:
          DEV: '{{.DEV}}'
    cmds:
      # `build:frontend` prepares the bundled plugins too, but it is skipped
      # when the frontend bundle is already up to date. Run it again here (a
      # no-op once it has executed) so a plugin-only change is never ignored.
      - task: common:prepare:plugins
      - 'go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"'
    vars:
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s" .BIN_DIR .APP_NAME)}}'
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s {{.EXTRA_LDFLAGS}}"{{end}}'
    env:
      GOOS: darwin
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 1
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  build:universal:
    summary: Builds a universal (arm64 + amd64) macOS binary
    deps:
      - task: common:go:mod:tidy
      - task: common:generate:icons
      - task: common:build:frontend
        vars:
          DEV: '{{.DEV}}'
    cmds:
      - task: common:prepare:plugins
      - task: build:arch
        vars:
          ARCH: amd64
          OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-amd64'
      - task: build:arch
        vars:
          ARCH: arm64
          OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-arm64'
      - task: '{{if eq OS "darwin"}}build:universal:lipo:native{{else}}build:universal:lipo:tool{{end}}'
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:arch:
    summary: Builds a single macOS architecture without re-running the shared steps
    internal: true
    cmds:
      - 'go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s {{.EXTRA_LDFLAGS}}"{{end}}'
    env:
      GOOS: darwin
      GOARCH: '{{.ARCH}}'
      CGO_ENABLED: 1
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  build:universal:lipo:native:
    summary: Merges both architectures with the native lipo tool
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:universal:lipo:tool:
    summary: Merges both architectures with the Wails lipo tool
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.BIN_DIR}}/{{.APP_NAME}}" -input "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" -input "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  bundle:
    summary: Creates the `.app` bundle from an existing binary
    dir: '{{.ROOT_DIR}}'
    cmds:
      # A reused bundle can acquire Finder metadata in synced folders. Build a
      # fresh bundle so codesign never has to replace a contaminated signature.
      - rm -rf -- "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      - task: '{{if eq OS "darwin"}}codesign:adhoc{{else}}codesign:skip{{end}}'

  package:
    summary: Builds and packages the application into a `.app` bundle
    deps:
      - task: build
        vars:
          DEV: '{{.DEV}}'
    cmds:
      - task: bundle

  package:universal:
    summary: Builds a universal binary and packages it into a `.app` bundle
    deps:
      - task: build:universal
    cmds:
      - task: bundle

  codesign:adhoc:
    summary: Ad-hoc signs the app bundle (macOS only)
    internal: true
    dir: '{{.ROOT_DIR}}'
    cmds:
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - codesign --verify --deep --strict "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  codesign:skip:
    summary: Skips codesigning when the build host is not macOS
    internal: true
    cmds:
      - 'echo "Skipping codesign (not running on macOS). Sign the .app on macOS before distribution."'

  run:
    summary: Runs the built application
    dir: '{{.ROOT_DIR}}'
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}"'
