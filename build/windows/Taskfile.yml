version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # NSIS sources. This directory is intentionally not `build/windows/nsis`:
  # `wails3 update build-assets` regenerates the stock templates and would
  # overwrite the hardened installer used for release packages.
  NSIS_DIR: "build/windows/installer"

tasks:
  build:
    summary: Builds the Windows executable
    deps:
      - task: common:go:mod:tidy
      - task: common:generate:icons
      - task: common:build:frontend
        vars:
          DEV: '{{.DEV}}'
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
      # `build:frontend` prepares the bundled plugins too, but it is skipped
      # when the frontend bundle is already up to date. Run it again here (a
      # no-op once it has executed) so a plugin-only change is never ignored.
      - task: common:prepare:plugins
      - 'go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"'
      - cmd: powershell Remove-Item -Force *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s.exe" .BIN_DIR .APP_NAME)}}'
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui {{.EXTRA_LDFLAGS}}"{{end}}'
    env:
      GOOS: windows
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 0

  generate:syso:
    summary: Generates the Windows resource file (icon, manifest, version info)
    internal: true
    dir: '{{.ROOT_DIR}}/build'
    cmds:
      - wails3 generate syso -arch {{.ARCH | default ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH | default ARCH}}.syso

  package:
    summary: Builds the application and creates the NSIS installer
    deps:
      - task: build
        vars:
          DEV: '{{.DEV}}'
    cmds:
      - task: create:nsis:installer
        vars:
          ARCH: '{{.ARCH}}'
          INSTALL_SCOPE: '{{.INSTALL_SCOPE}}'

  create:nsis:installer:
    summary: Creates the NSIS installer from an existing build
    dir: '{{.ROOT_DIR}}/{{.NSIS_DIR}}'
    cmds:
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/{{.NSIS_DIR}}"
      - >-
        makensis
        {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}
        -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe"
        project.nsi
    vars:
      ARG_FLAG: '{{if eq (.ARCH | default ARCH) "arm64"}}ARM64{{else}}AMD64{{end}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  run:
    summary: Runs the built application
    dir: '{{.ROOT_DIR}}'
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
