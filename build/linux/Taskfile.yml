version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  check:toolchain:
    internal: true
    cmds:
      - bash build/linux/check-toolchain.sh

  build:
    summary: Builds the application for Linux
    preconditions:
      - sh: bash build/linux/check-toolchain.sh
        msg: Linux build tools must match go.mod; rebuild outdated Docker containers.
    deps:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
      - task: common:generate:icons
    cmds:
      - task: common:bundle:plugins
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -X res-downloader/internal/app.ReleaseVersion={{.RELEASE_VERSION}}"{{else}}{{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{end}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production build of the application for Linux
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - task: create:deb
      - task: create:appimage

  create:appimage:
    summary: Creates an AppImage
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
      - task: generate:dotdesktop
    cmds:
      - wails3 generate appimage -binary {{.BIN_DIR}}/{{.APP_NAME}} -icon build/linux/Debian/usr/share/icons/hicolor/256x256/apps/res-downloader.png -desktopfile build/linux/res-downloader.desktop -outputdir {{.BIN_DIR}} -builddir build/linux/appimage/build

  create:deb:
    summary: Creates a deb package
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - task: generate:deb

  generate:deb:
    summary: Packages and statically checks the Linux executable
    cmds:
      - task: check:toolchain
      - bash build/linux/package-deb.sh
    env:
      ARCH: '{{.ARCH | default ARCH}}'
      PACKAGE_VERSION: '{{.PACKAGE_VERSION | default .PRODUCT_VERSION}}'
    vars:
      PRODUCT_VERSION:
        sh: "sed -n 's/^  version: *//p' build/config.yml"

  generate:dotdesktop:
    summary: Copies the shared Linux desktop entry for AppImage
    cmds:
      - cp build/linux/application.desktop build/linux/res-downloader.desktop
      - desktop-file-validate build/linux/res-downloader.desktop

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
