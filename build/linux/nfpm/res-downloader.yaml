name: "res-downloader"
arch: ${GOARCH}
platform: "linux"
version: "${RESD_PRODUCT_VERSION}"
section: "default"
priority: "extra"
maintainer: putyy@qq.com
description: "A resource downloader with network capture and fast downloads"
vendor: "res-downloader"
homepage: "https://github.com/putyy/res-downloader"
license: "Apache-2.0"
release: "1"

contents:
  - src: "./bin/res-downloader"
    dst: "/usr/local/bin/res-downloader"
  - src: "./build/linux/Debian/usr/share/icons/hicolor/256x256/apps/res-downloader.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/appicon.png"
  - src: "./build/linux/res-downloader.desktop"
    dst: "/usr/share/applications/res-downloader.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

