# Wails v3 build configuration.
#
# `info` feeds the generated platform metadata (Windows version resource, macOS
# Info.plist, NSIS installer defines). Keep `info.version` in sync with
# `info.productVersion` in app.json, which stays the single source of truth
# for the application version used at runtime and by the release pipeline.
# `wails3 task common:update:build-assets` regenerates the platform assets
# below from this file.
version: '3'

info:
  companyName: "res-downloader"
  productName: "res-downloader"
  # Retained from previous releases so macOS upgrades reuse the same bundle
  # identity (LaunchServices registration, saved window state, update handoff).
  productIdentifier: "com.wails.res-downloader"
  description: "A high-value high-performance and diverse resource downloader."
  copyright: "Copyright © 2023"
  comments: "This is a high-value high-performance and diverse resource downloader called res-downloader."
  version: "4.0.0"

# Development mode configuration used by `wails3 dev`.
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - build/bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations:
