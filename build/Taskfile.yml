version: '3'

# Shared build steps for every platform. Paths are resolved from the project
# root because this file is included by the root Taskfile.

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    dir: '{{.ROOT_DIR}}'
    cmds:
      - go mod tidy

  prepare:plugins:
    summary: Prepares runtime files for the bundled official plugins
    run: once
    dir: '{{.ROOT_DIR}}'
    cmds:
      - '{{if eq .SKIP_PLUGINS "true"}}echo "Skipping bundled plugin preparation (SKIP_PLUGINS=true)"{{else}}go run ./cmd/bundleplugins{{end}}'

  install:frontend:deps:
    summary: Installs the frontend dependencies
    run: once
    dir: '{{.ROOT_DIR}}/frontend'
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "npm is required. Install Node.js from https://nodejs.org/"
    cmds:
      - npm install --no-audit --no-fund

  generate:bindings:
    summary: Generates the Wails v3 bindings consumed by the frontend
    run: once
    dir: '{{.ROOT_DIR}}'
    # Bundled plugins are intentionally not a dependency here: generating the
    # bindings only needs the Go sources to compile. Keeping this task free of
    # `prepare:plugins` lets `check` and `frontend:check` run in a checkout
    # where the plugin repositories have not been cloned yet.
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -clean=true -ts

  build:frontend:
    summary: Builds the frontend bundle embedded into the binary
    run: once
    dir: '{{.ROOT_DIR}}/frontend'
    sources:
      - "**/*"
      - exclude: node_modules/**/*
      - exclude: dist/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
    cmds:
      # Sequential on purpose: the bundled plugin files are embedded by the Go
      # build and read while generating the bindings, so they must exist first.
      - task: prepare:plugins
      - task: generate:bindings
      - '{{if eq .DEV "true"}}npm run build:dev{{else}}npm run build{{end}}'
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  frontend:check:
    summary: Type-checks the frontend without emitting a bundle
    dir: '{{.ROOT_DIR}}/frontend'
    deps:
      - task: generate:bindings
    cmds:
      - npm run check

  generate:icons:
    summary: Generates the platform icon assets from build/appicon.png
    run: once
    dir: '{{.ROOT_DIR}}/build'
    sources:
      - appicon.png
    generates:
      - darwin/icons.icns
      - windows/icon.ico
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

  update:build-assets:
    summary: Regenerates the platform metadata from build/config.yml
    dir: '{{.ROOT_DIR}}/build'
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .

  dev:frontend:
    summary: Runs the frontend dev server used by `wails3 dev`
    deps:
      - task: install:frontend:deps
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort
